name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare Release Package
        run: |
          mkdir dist
          copy bin\Release\gdds_tool.exe dist\
          copy Dependencies\DirectStorage\lib\x64\dstorage.dll dist\
          copy Dependencies\DirectStorage\lib\x64\dstoragecore.dll dist\
          copy README.md dist\
          copy LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath gdds-tool-windows-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: gdds-tool-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
