name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exe = Get-ChildItem -Path . -Recurse -Filter "gdds_tool.exe" | Where-Object { $_.FullName -notmatch "dist" } | Select-Object -First 1
          if (-not $exe) { throw "Could not find gdds_tool.exe" }
          Copy-Item $exe.FullName dist\ -Force
          Copy-Item Dependencies\DirectStorage\lib\x64\dstorage.dll dist\ -Force
          Copy-Item Dependencies\DirectStorage\lib\x64\dstoragecore.dll dist\ -Force
          Copy-Item README.md dist\ -Force
          Copy-Item LICENSE dist\ -Force
          Compress-Archive -Path dist\* -DestinationPath gdds-tool-windows-x64.zip -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: gdds-tool-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
